<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 564" width="960" height="564" font-family="Hanken Grotesk, Segoe UI, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Eight stages of a receipt: envelope, subjects, identity, canonical form, address, signature, re-derive, verdict. The receipt's identifier is a hash of the receipt with its own identifier, signature, and per-implementation block removed, so a doctored field changes the address it is stored under. An optional signature covers that same body, so the two never disagree about what they cover. A reader on another machine recomputes the address and compares, with no anchor store, no log, and no network. Three outcomes: valid, tampered, and unverifiable, and tampered outranks unverifiable."><style>
  :root{ --void:#f4f3ef; --bone:#0b0c0e; --muted:#43474e;
    --hairline:rgba(11,12,14,.16); --card:rgba(255,255,255,.66);
    --verified:#1f7a52; --drift:#3a2bd6; }
  @media (prefers-color-scheme: dark){
    :root{ --void:#0b0e0f; --bone:#eef1ee; --muted:#9aa39c;
      --hairline:rgba(238,241,238,.18); --card:rgba(255,255,255,.05);
      --verified:#5fae93; --drift:#a99cf5; } }
  .bg{ fill:var(--void); }
  .card{ fill:var(--card); stroke:var(--hairline); stroke-width:1.4; }
  .n{ fill:var(--bone); font-size:15px; font-weight:650; }
  .s{ fill:var(--muted); font-size:11.5px; }
  .k{ fill:var(--muted); font-size:11px; letter-spacing:.16em; }
  .h{ fill:var(--bone); font-size:21px; font-weight:700; }
  .fwd{ stroke:var(--verified); stroke-width:2; fill:none; }
  .back{ stroke:var(--drift); stroke-width:1.8; fill:none; stroke-dasharray:5 4; }
  .thin{ stroke:var(--hairline); stroke-width:1.4; fill:none; }
  .step{ fill:var(--muted); font-size:11px; font-weight:700; letter-spacing:.1em; }
</style><marker id="af" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--verified)"/></marker><marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--drift)"/></marker><rect class="bg" width="960" height="564"/><text class="k" x="44" y="40" font-family="Conso, ui-monospace, Cascadia Mono, Consolas, monospace">ONE VERDICT, HANDED TO A STRANGER</text><text class="h" x="44" y="72">How a verdict travels to someone who shares no state with you</text><path class="fwd" marker-end="url(#af)" d="M246.5 158H261.5"/><path class="fwd" marker-end="url(#af)" d="M471 158H486"/><path class="fwd" marker-end="url(#af)" d="M695.5 158H710.5"/><path class="fwd" marker-end="url(#af)" d="M920 158H940V276H20V350H37"/><path class="fwd" marker-end="url(#af)" d="M246.5 350H261.5"/><path class="fwd" marker-end="url(#af)" d="M471 350H486"/><path class="fwd" marker-end="url(#af)" d="M695.5 350H710.5"/><path class="back" marker-end="url(#ab)" d="M592.25 398V420H143.25V405"/><text class="k" x="367.75" y="437" text-anchor="middle" fill="var(--drift)">THE STORED ID IS NEVER TRUSTED, ONLY RECOMPUTED</text><g><rect class="card" x="44" y="110" width="198.5" height="96" rx="3"/><text class="step" x="58" y="101">01</text><text class="n" x="58" y="142">Envelope</text><text class="s" x="58" y="168">One completed verdict, in the</text><text class="s" x="58" y="183">canonical JSON form.</text></g><g><rect class="card" x="268.5" y="110" width="198.5" height="96" rx="3"/><text class="step" x="282.5" y="101">02</text><text class="n" x="282.5" y="142">Subjects</text><text class="s" x="282.5" y="168">Each path, with the digest</text><text class="s" x="282.5" y="183">that was actually recorded.</text></g><g><rect class="card" x="493" y="110" width="198.5" height="96" rx="3"/><text class="step" x="507" y="101">03</text><text class="n" x="507" y="142">Identity</text><text class="s" x="507" y="168">The tool's own artifact hash,</text><text class="s" x="507" y="183">naming what produced this.</text></g><g><rect class="card" x="717.5" y="110" width="198.5" height="96" rx="3"/><text class="step" x="731.5" y="101">04</text><text class="n" x="731.5" y="142">Canonical</text><text class="s" x="731.5" y="168">One byte form, so two machines</text><text class="s" x="731.5" y="183">compose the same bytes.</text></g><g><rect class="card" x="44" y="302" width="198.5" height="96" rx="3"/><text class="step" x="58" y="293">05</text><text class="n" x="58" y="334">Address</text><text class="s" x="58" y="360">A hash of the receipt with its</text><text class="s" x="58" y="375">own id and signature cut.</text></g><g><rect class="card" x="268.5" y="302" width="198.5" height="96" rx="3"/><text class="step" x="282.5" y="293">06</text><text class="n" x="282.5" y="334">Signature</text><text class="s" x="282.5" y="360">Optional, over that same body,</text><text class="s" x="282.5" y="375">so the two agree on scope.</text></g><g><rect class="card" x="493" y="302" width="198.5" height="96" rx="3"/><text class="step" x="507" y="293">07</text><text class="n" x="507" y="334">Re-derive</text><text class="s" x="507" y="360">The reader recomputes it. No</text><text class="s" x="507" y="375">store, no log, no network.</text></g><g><rect class="card" x="717.5" y="302" width="198.5" height="96" rx="3"/><text class="step" x="731.5" y="293">08</text><text class="n" x="731.5" y="334">Verdict</text><text class="s" x="731.5" y="360">Tampered outranks</text><text class="s" x="731.5" y="375">unverifiable, as it does</text><text class="s" x="731.5" y="390">upstream.</text></g><path class="thin" d="M816.75 398V448"/><path class="thin" d="M816.75 448H180.67V472"/><rect x="44" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--verified)" stroke-width="1.6"/><text class="n" x="58" y="493" font-size="13">RECEIPT VALID</text><text class="s" x="58" y="509" font-size="10.5">the address re-derives from the bytes present</text><path class="thin" d="M816.75 448H480V472"/><rect x="343.33" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--drift)" stroke-width="1.6"/><text class="n" x="357.33" y="493" font-size="13">RECEIPT TAMPERED</text><text class="s" x="357.33" y="509" font-size="10.5">a doctored field or a changed subject</text><path class="thin" d="M816.75 448H779.33V472"/><rect x="642.67" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--muted)" stroke-width="1.6"/><text class="n" x="656.67" y="493" font-size="13">RECEIPT UNVERIFIABLE</text><text class="s" x="656.67" y="509" font-size="10.5">malformed, or a subject that cannot be read</text><text class="s" x="44" y="546">A signed receipt with no key to check it reads unverifiable. It never reads valid.</text></svg>
