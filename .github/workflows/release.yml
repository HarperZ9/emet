name: release

# Publish emet to PyPI via OIDC Trusted Publishing (no API token).
# Matches the PyPI pending publisher: repo HarperZ9/emet, workflow release.yml,
# environment "pypi". Fires when a GitHub release is published, and can be run
# manually (workflow_dispatch) for the first publish of an already-tagged release.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pypi-publish:
    name: build and publish emet (trusted publishing)
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/emet/
    permissions:
      id-token: write   # required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: conformance gate before publish (Python reference, 44/44)
        run: python conformance/run.py membrane.py
      - name: build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: check artifacts
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - name: publish to PyPI (OIDC, no token)
        uses: pypa/gh-action-pypi-publish@release/v1
