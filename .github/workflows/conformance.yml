name: conformance
on: [push, pull_request]

permissions:
  contents: read

jobs:
  python-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: behavior proof (membrane)
        run: python test_membrane.py
      - name: corpus unit tests
        run: python test_corpus.py
      - name: monitor behavior tests
        run: python test_monitor.py
      - name: organs behavior tests
        run: python test_organs.py
      - name: forward delivery contract
        run: python test_forward_delivery_contract.py
      - name: proof surface receipt test
        run: python test_proof_surface_receipt.py
      - name: conformance, Python reference (expect 35 of 35)
        run: python conformance/run.py membrane.py
      - name: selftest re-derives own identity (emet_self_sha256=)
        run: python membrane.py selftest
      - name: proof surface receipt adapter emits closed-lattice receipt
        run: |
          python membrane.py anchor README.md
          python adapters/proof_surface_receipt.py verify README.md anchors.json > receipt.json
          python - <<'PY'
          import json
          data = json.load(open("receipt.json", encoding="utf-8"))
          assert data["receipt_id"].startswith("emet-verify-")
          assert data["verdict"] in {"MATCH", "DRIFT", "UNVERIFIABLE"}
          assert "TRUSTED" not in json.dumps(data)
          PY
      - name: rationale walkthrough transcript is re-derivable
        run: python test_walkthrough.py

  rust-second-implementation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: build rust impl (rustc is preinstalled on ubuntu-latest)
        run: rustc -O impl/rust/emet.rs -o impl/rust/emet
      - name: conformance, Rust second implementation (expect 35 of 35)
        run: python conformance/run.py impl/rust/emet

  js-third-implementation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: conformance, Node.js third implementation (expect 35 of 35)
        run: python conformance/run.py impl/js/emet.js

  go-fourth-implementation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: build go impl (standard library only, no modules)
        run: CGO_ENABLED=0 go build -o impl/go/emet impl/go/emet.go
      - name: conformance, Go fourth implementation (expect 35 of 35)
        run: python conformance/run.py impl/go/emet

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: install the emet-witness package (zero runtime deps)
        run: python -m pip install .
      - name: the installed emet console script re-derives its own identity
        run: emet selftest
      - name: conformance against the INSTALLED emet console script (expect 35 of 35)
        run: python conformance/run.py "$(python -c 'import shutil; print(shutil.which("emet"))')"
